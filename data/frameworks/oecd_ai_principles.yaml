id: OECD
name: OECD AI Principles - Values-based Principles
short: OECD
kind: principle
version: "Recommendation of the Council on AI (2019, updated 2024)"
source_url: https://oecd.ai/en/ai-principles
licence_note: Principle titles from the OECD; summaries paraphrased for this project.
items:
  - {id: OECD-1.1, title: "Inclusive growth, sustainable development and well-being", description: "AI should benefit people and the planet, reduce inequality and protect the environment."}
  - {id: OECD-1.2, title: "Respect for the rule of law, human rights and democratic values, including fairness and privacy", description: "AI should respect rights, non-discrimination, privacy and human agency, with safeguards such as human oversight."}
  - {id: OECD-1.3, title: "Transparency and explainability", description: "People should know when they interact with AI and be able to understand and challenge outcomes."}
  - {id: OECD-1.4, title: "Robustness, security and safety", description: "AI should work reliably and securely across its lifecycle, with mechanisms to override or shut it down safely."}
  - {id: OECD-1.5, title: "Accountability", description: "AI actors are accountable for proper functioning, with traceability and systematic risk management."}
